name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    strategy:
      matrix:
        # Запускаємо на трьох ОС одночасно
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run Maven Verify (Compile, Test, SpotBugs, Package)
      # Команда verify автоматично запускає тести і аналізатор перед пакуванням JAR
      run: mvn -B clean verify

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lab01-bohush-jar-${{ matrix.os }}
        path: target/*.jar
        retention-days: 5